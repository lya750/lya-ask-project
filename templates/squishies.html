    <script>
        async function toggleFavourite(button) {
            if (button.disabled) return;

            button.disabled = true;

            const wasAdded =
                button.textContent.trim() === "🩷";

            const formData = new URLSearchParams({
                product: button.dataset.product,
                price: button.dataset.price,
                image: button.dataset.image
            });

            try {
                const response = await fetch("/toggle_favourite", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                if (!response.ok) {
                    throw new Error("Could not update favourites");
                }

                const result = (await response.text()).trim();

                if (result === "added") {
                    button.textContent = "🩷";
                } else if (result === "removed") {
                    button.textContent = "🤍";
                } else {
                    throw new Error("Unexpected server response");
                }

            } catch (error) {
                alert("Unable to update favourites. Please try again.");
                console.error(error);
            } finally {
                button.disabled = false;
            }
        }

        async function toggleCart(button) {
            if (button.disabled) return;

            button.disabled = true;

            const wasAdded = button.classList.contains("added");

            const formData = new URLSearchParams({
                product: button.dataset.product,
                price: button.dataset.price,
                image: button.dataset.image,
                action: wasAdded ? "remove" : "add"
            });

            try {
                const response = await fetch("/toggle_cart", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                if (!response.ok) {
                    throw new Error("Could not update cart");
                }

                const result = (await response.text()).trim();

                if (result === "added") {
                    button.classList.add("added");
                    button.textContent = "Added!";
                } else if (result === "removed") {
                    button.classList.remove("added");
                    button.textContent = "Add to Cart";
                } else {
                    throw new Error("Unexpected server response");
                }

            } catch (error) {
                alert("Unable to update your cart. Please try again.");
                console.error(error);
            } finally {
                button.disabled = false;
            }
        }
    </script>
